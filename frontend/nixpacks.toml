# Dokploy / Nixpacks — Next.js 16 requires Node 22+.
# Dokploy: Root Directory = frontend, Build = Nixpacks (or Railpack).

[phases.setup]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

[variables]
NIXPACKS_NODE_VERSION = "22"
HOSTNAME = "0.0.0.0"
