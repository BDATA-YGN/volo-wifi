<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volo WiFi — Redirecting</title>
    <script src="portal-config.js"></script>
    <script>
        /** Binary MikroTik CHAP values → hex (safe for URL query strings). */
        function mikrotikToHex(str) {
            if (!str) return '';
            var hex = '';
            for (var i = 0; i < str.length; i++) {
                var b = str.charCodeAt(i) & 0xff;
                hex += (b < 16 ? '0' : '') + b.toString(16);
            }
            return hex;
        }

        function portalAuthBase() {
            if (window.VOLO_PORTAL_AUTH) return window.VOLO_PORTAL_AUTH;
            return 'https://portal-v2.volowifi.com/portal/auth';
        }

        function buildPortalAuthUrl() {
            var q = new URLSearchParams();

            q.set('mac', '$(mac)');
            q.set('ip', '$(ip)');
            // Hotspot IP — do NOT use $(hostname) (DNS name, e.g. wifi.local)
            q.set('nas_ip', '$(server-address)');
            q.set('NASID', '$(identity)');
            q.set('hostname', '$(hostname)');
            q.set('server-name', '$(server-name)');
            if ('$(username)' !== '') q.set('username', '$(username)');
            q.set('link-login', '$(link-login-esc)');
            q.set('link-login-only', '$(link-login-only-esc)');
            q.set('link-logout', '$(link-logout-esc)');
            q.set('link-orig', '$(link-orig-esc)');
            if ('$(error)' !== '') q.set('error', '$(error)');

            var chapId = '$(chap-id)';
            var chapChallenge = '$(chap-challenge)';
            if (chapId) q.set('chap-id-hex', mikrotikToHex(chapId));
            if (chapChallenge) q.set('chap-challenge-hex', mikrotikToHex(chapChallenge));

            var base = portalAuthBase();
            var sep = base.indexOf('?') >= 0 ? '&' : '?';
            return base + sep + q.toString();
        }

        (function () {
            location.replace(buildPortalAuthUrl());
        })();
    </script>
</head>
<body>
    <p>Redirecting to Volo WiFi...</p>
    <p><a id="fallback" href="#">Click here if not redirected</a></p>
    <script>
        document.getElementById('fallback').href = buildPortalAuthUrl();
    </script>
</body>
</html>
