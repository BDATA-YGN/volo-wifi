authorize_group_check_query = "\
	SELECT \
		ROW_NUMBER() OVER (ORDER BY deduped.priority ASC, deduped.pra_id)::integer AS id, \
		deduped.GroupName, \
		deduped.Attribute, \
		deduped.Value, \
		deduped.Op \
	FROM ( \
		SELECT DISTINCT ON (pra.\"attributeName\") \
			p.code || COALESCE(c.username, c.token) AS GroupName, \
			pra.\"attributeName\" AS Attribute, \
			CASE \
				WHEN pra.op IN (':=','=','==','+=','-=','!=','>','>=','<','<=','=~','!~','=*','!*') THEN pra.op \
				ELSE '==' \
			END AS Op, \
			pra.value AS Value, \
			pra.priority AS priority, \
			pra.id AS pra_id \
		FROM wf_credential c \
		INNER JOIN wf_plan p ON p.id = c.plan_id AND p.deleted_at IS NULL \
		LEFT JOIN wf_station ws ON ws.id = c.station_id AND ws.deleted_at IS NULL \
		INNER JOIN wf_plan_radius_attribute pra ON pra.plan_id = p.id \
			AND pra.phase = 'CHECK' \
			AND pra.deleted_at IS NULL \
			AND ( \
				pra.wifi_station_id IS NULL \
				OR (c.station_id IS NOT NULL AND pra.wifi_station_id = c.station_id) \
			) \
			AND ( \
				c.station_id IS NULL \
				OR ws.radius_vendor_profile_id IS NULL \
				OR pra.vendor_profile_id IS NULL \
				OR pra.vendor_profile_id = ws.radius_vendor_profile_id \
			) \
		WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
		AND (c.expires_at IS NULL OR c.expires_at > CURRENT_TIMESTAMP) \
		AND c.deleted_at IS NULL \
		AND (p.code || COALESCE(c.username, c.token)) = '%{${group_attribute}}' \
		ORDER BY pra.\"attributeName\", pra.priority ASC, pra.id \
	) deduped \
	ORDER BY deduped.priority ASC, deduped.pra_id"

# REPLY attributes are already merged via authorize_reply_query (radreply / wf_plan_radius_attribute
# phase REPLY per user). radgroupreply is an intentionally empty view; querying it still costs
# ~3s on production if the DB view was not recreated. Return zero rows without touching the view.
authorize_group_reply_query = "\
	SELECT \
		NULL::integer AS id, \
		NULL::varchar(128) AS GroupName, \
		NULL::varchar(64) AS Attribute, \
		NULL::varchar(253) AS Value, \
		NULL::varchar(2) AS op \
	WHERE false"

#######################################################################
# Simultaneous Use Checking Queries
#######################################################################
# simul_count_query     - query for the number of current connections
#                       - If this is not defined, no simultaneous use checking
#                       - will be performed by this module instance
# simul_verify_query    - query to return details of current connections for verification
#                       - Leave blank or commented out to disable verification step
#                       - Note that the returned field order should not be changed.
#######################################################################

simul_count_query = "\
	SELECT COUNT(id) \
	FROM wf_radius_session a \
	WHERE user_name='%{SQL-User-Name}' \
	AND stopped_at IS NULL "

simul_verify_query = "\
	SELECT id, acct_session_id, user_name, nas_ip_address, '0', framed_ip_address, \"callingStationId\", \
		'prot' \
	FROM wf_radius_session a \
	WHERE user_name='%{SQL-User-Name}' \
	AND stopped_at IS NULL "

