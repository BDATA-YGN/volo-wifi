# -*- text -*-
#
#  Volo FreeRADIUS ↔ PostgreSQL (volo_wifi_db)
#
#  Live tables:
#    wf_credential              auth identity + plan/station + activate
#    wf_plan                    max_devices / quota templates
#    wf_plan_radius_attribute   Plan RADIUS Policies (REPLY / CHECK)
#    wf_station                 radius_vendor_profile_id (vendor filter)
#    wf_radius_session          accounting + Simultaneous-Use
#    radpostauth                optional auth log (post-auth)
#
#  Not used: radcheck/radreply/radgroup*/radacct/nas/nasreload,
#  retail price books, or CHECK-phase policies (0 live rows today).
#
#  Group lookups are disabled in mods-available/sql (read_groups = no)
#  because REPLY attrs come from authorize_reply_query. Stubs below
#  remain so re-enabling groups is safe.

sql_user_name = "%{User-Name}"

#
#  Timezone model (DO Managed PG + Prisma timestamptz):
#  - DateTime columns are timestamptz (absolute instants).
#  - SQL session TimeZone = Asia/Yangon (connection options / PGTZ) for NOW() display.
#  - TO_TIMESTAMP(epoch) returns timestamptz — store directly (no AT TIME ZONE cast).
#  - CURRENT_TIMESTAMP is fine for activated_at / updated_at / expires checks.
#
event_timestamp_epoch = "%{%{integer:Event-Timestamp}:-%l}"
event_timestamp = "TO_TIMESTAMP(${event_timestamp_epoch})"

#######################################################################
#  NAS clients — failsafe only (read_clients = no; clients.conf "any")
#######################################################################

client_query = "\
	SELECT \
		NULL::integer AS id, \
		NULL::text AS nasname, \
		NULL::text AS shortname, \
		NULL::text AS type, \
		NULL::text AS secret, \
		NULL::text AS server \
	WHERE false"

#######################################################################
#  Authorize
#  Row order: id, UserName/GroupName, Attribute, Value, Op
#######################################################################

#
#  Password/token + Simultaneous-Use from plan.max_devices.
#  One credential/plan hit via LATERAL VALUES (no double scan).
#
authorize_check_query = "\
	SELECT \
		c.id::text AS id, \
		COALESCE(c.username, c.token) AS UserName, \
		v.attribute AS Attribute, \
		v.value AS Value, \
		':=' AS Op \
	FROM wf_credential c \
	INNER JOIN wf_plan p ON p.id = c.plan_id AND p.deleted_at IS NULL \
	CROSS JOIN LATERAL ( \
		VALUES \
			( \
				CASE \
					WHEN c.username IS NOT NULL AND c.password_hash IS NOT NULL \
						THEN 'Crypt-Password' \
					ELSE 'Cleartext-Password' \
				END, \
				CASE \
					WHEN c.username IS NOT NULL AND c.password_hash IS NOT NULL \
						THEN c.password_hash \
					ELSE c.token \
				END \
			), \
			('Simultaneous-Use', COALESCE(p.max_devices, 1)::text) \
	) AS v(attribute, value) \
	WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
	AND c.\"status\" IN ('SOLD', 'ACTIVATED') \
	AND c.deleted_at IS NULL \
	AND c.revoked_at IS NULL \
	AND (c.expires_at IS NULL OR c.expires_at > CURRENT_TIMESTAMP) \
	AND ( \
		(c.username IS NOT NULL AND c.password_hash IS NOT NULL) \
		OR c.token IS NOT NULL \
	) \
	ORDER BY CASE WHEN v.attribute = 'Simultaneous-Use' THEN 2 ELSE 1 END, c.id"

#
#  REPLY from Plan RADIUS Policies:
#    plan + vendor (station.radius_vendor_profile_id) + optional site override
#  Prefer site-scoped rows over plan-wide (wifi_station_id NULL).
#  Console always stores op as ':=' and a concrete value (or {timeSeconds}/{dataMb}).
#
authorize_reply_query = "\
	SELECT \
		deduped.pra_id AS id, \
		deduped.UserName, \
		deduped.Attribute, \
		deduped.Value, \
		deduped.Op \
	FROM ( \
		SELECT DISTINCT ON (pra.\"attributeName\") \
			COALESCE(c.username, c.token) AS UserName, \
			pra.\"attributeName\" AS Attribute, \
			COALESCE(NULLIF(pra.op, ''), ':=') AS Op, \
			CASE \
				WHEN pra.value LIKE '%%{timeSeconds}%%' THEN \
					REPLACE( \
						pra.value, \
						'{timeSeconds}', \
						COALESCE( \
							c.\"timeRemainingSec\"::text, \
							(p.time_amount * \
								CASE p.time_unit \
									WHEN 'MINUTE' THEN 60 \
									WHEN 'HOUR' THEN 3600 \
									WHEN 'DAY' THEN 86400 \
									WHEN 'MONTH' THEN 2592000 \
									ELSE 0 \
								END)::text, \
							'0' \
						) \
					) \
				WHEN pra.value LIKE '%%{dataMb}%%' THEN \
					REPLACE( \
						pra.value, \
						'{dataMb}', \
						COALESCE(c.data_remaining_mb::text, p.data_mb::text, '0') \
					) \
				ELSE pra.value \
			END AS Value, \
			pra.priority AS priority, \
			pra.id AS pra_id \
		FROM wf_credential c \
		INNER JOIN wf_plan p ON p.id = c.plan_id AND p.deleted_at IS NULL \
		LEFT JOIN wf_station ws ON ws.id = c.station_id AND ws.deleted_at IS NULL \
		INNER JOIN wf_plan_radius_attribute pra ON pra.plan_id = p.id \
			AND pra.phase = 'REPLY' \
			AND pra.deleted_at IS NULL \
			AND ( \
				pra.wifi_station_id IS NULL \
				OR (c.station_id IS NOT NULL AND pra.wifi_station_id = c.station_id) \
			) \
			AND ( \
				ws.radius_vendor_profile_id IS NULL \
				OR pra.vendor_profile_id = ws.radius_vendor_profile_id \
			) \
		WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
		AND c.\"status\" IN ('SOLD', 'ACTIVATED') \
		AND c.deleted_at IS NULL \
		AND c.revoked_at IS NULL \
		AND (c.expires_at IS NULL OR c.expires_at > CURRENT_TIMESTAMP) \
		ORDER BY \
			pra.\"attributeName\", \
			CASE WHEN pra.wifi_station_id IS NOT NULL THEN 0 ELSE 1 END, \
			pra.priority ASC, \
			pra.id \
	) deduped \
	ORDER BY deduped.priority ASC, deduped.pra_id"

