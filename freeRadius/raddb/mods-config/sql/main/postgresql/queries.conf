#######################################################################
#  Simultaneous-Use (open sessions on other MACs only)
#######################################################################

simul_count_query = "\
	SELECT COUNT(id) \
	FROM wf_radius_session a \
	WHERE user_name = '%{SQL-User-Name}' \
	AND stopped_at IS NULL \
	AND ( \
		a.\"callingStationId\" IS NULL \
		OR UPPER(REPLACE(REPLACE(a.\"callingStationId\", ':', ''), '-', '')) \
			<> UPPER(REPLACE(REPLACE('%{Calling-Station-Id}', ':', ''), '-', '')) \
	)"

simul_verify_query = "\
	SELECT \
		id, \
		acct_session_id, \
		user_name, \
		nas_ip_address, \
		'0', \
		framed_ip_address, \
		\"callingStationId\", \
		'prot' \
	FROM wf_radius_session a \
	WHERE user_name = '%{SQL-User-Name}' \
	AND stopped_at IS NULL \
	AND ( \
		a.\"callingStationId\" IS NULL \
		OR UPPER(REPLACE(REPLACE(a.\"callingStationId\", ':', ''), '-', '')) \
			<> UPPER(REPLACE(REPLACE('%{Calling-Station-Id}', ':', ''), '-', '')) \
	)"

#######################################################################
#  Accounting → wf_radius_session
#  Unique key: (acct_session_id, nas_ip_address)
#
#  Bytes (inputBytes / outputBytes / totalBytes) are written ONLY from
#  IETF attributes on Interim-Update (and Alive) and Stop:
#    Acct-Input-Octets  + Acct-Input-Gigawords
#    Acct-Output-Octets + Acct-Output-Gigawords
#  Start queries never touch those columns (Start is almost always 0).
#  Ruijie VSAs (Ruijie-Input-Octets, vendor 4881) are NOT mapped — if
#  the EG sends only VSAs, the session row stays 0 / null.
#
#  Store Acct-Session-Time as sessionTimeSec. Do not GREATEST with start→stop
#  wall clock (that made idle hotspot rows look like 70h+ sessions).
#  used_sec trusts NAS time; last-interim span is used only when NAS time is
#  missing or looks like a Session-Timeout copy (>12h and >2× last update).
#  Cleanup STOP timestamps use last_interim_at, not now.
#
#  MikroTik hotspot reuses Acct-Session-Id when a new voucher logs into an
#  existing host. Accounting-Stop used to overwrite user_name on that old
#  row, so a 3-hour token inherited a week-old started_at (162h+ duration).
#  rebound-orphan renames the leftover row first so the new token INSERTs.
#######################################################################

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	#
	#  Not an Acct-Status-Type — referenced by start / interim-update / stop.
	#
	rebound-orphan {
		query = "\
			UPDATE wf_radius_session \
			SET \
				acct_session_id = acct_session_id || ':rebound:' || REPLACE(id::text, '-', ''), \
				stopped_at = COALESCE(stopped_at, last_interim_at, created_at, started_at), \
				status = 'STOP'::\"RadiusAcctStatus\", \
				terminate_cause = COALESCE(NULLIF(terminate_cause, ''), 'User-Name-Rebound'), \
				updated_at = CURRENT_TIMESTAMP \
			WHERE acct_session_id = '%{Acct-Session-Id}' \
			AND nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
			AND user_name IS NOT NULL \
			AND user_name <> '%{SQL-User-Name}'"
	}

	type {
		accounting-on {
			query = "\
				UPDATE wf_radius_session \
				SET \
					stopped_at = COALESCE(last_interim_at, created_at, started_at), \
					terminate_cause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}', \
					status = 'STOP'::\"RadiusAcctStatus\", \
					updated_at = CURRENT_TIMESTAMP \
				WHERE stopped_at IS NULL \
				AND nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND started_at <= ${....event_timestamp}"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		start {
			#
			#  Close leftover hotspot rows that already belong to another
			#  voucher (same Acct-Session-Id, different User-Name).
			#
			query = "${...rebound-orphan.query}"

			#
			#  Close older open rows for this user+MAC before binding the new
			#  Acct-Session-Id (Ruijie Start floods otherwise leave ghost sessions
			#  that undercount / inflate remaining).
			#
			query = "\
				UPDATE wf_radius_session \
				SET \
					stopped_at = COALESCE(last_interim_at, created_at, started_at), \
					terminate_cause = 'Superseded-Start', \
					status = 'STOP'::\"RadiusAcctStatus\", \
					updated_at = CURRENT_TIMESTAMP \
				WHERE stopped_at IS NULL \
				AND user_name = '%{SQL-User-Name}' \
				AND acct_session_id <> '%{Acct-Session-Id}' \
				AND ( \
					NULLIF('%{Calling-Station-Id}', '') IS NULL \
					OR \"callingStationId\" IS NULL \
					OR UPPER(REPLACE(REPLACE(\"callingStationId\", ':', ''), '-', '')) \
						= UPPER(REPLACE(REPLACE('%{Calling-Station-Id}', ':', ''), '-', '')) \
				)"

			#
			#  Refresh open row for this Acct-Session-Id.
			#  Never rewrite started_at — that resets the usage clock on Start floods.
			#
			query = "\
				UPDATE wf_radius_session AS rs \
				SET \
					user_name = CASE \
						WHEN rs.credential_id IS NULL THEN '%{SQL-User-Name}' \
						WHEN c.credential_id IS NOT NULL AND c.credential_id = rs.credential_id \
							THEN '%{SQL-User-Name}' \
						ELSE rs.user_name \
					END, \
					last_interim_at = ${....event_timestamp}, \
					status = 'START'::\"RadiusAcctStatus\", \
					\"callingStationId\" = '%{Calling-Station-Id}', \
					framed_ip_address = NULLIF('%{Framed-IP-Address}', '')::text, \
					nas_identifier = NULLIF('%{NAS-Identifier}', ''), \
					org_id = COALESCE(rs.org_id, c.org_id), \
					station_id = COALESCE(rs.station_id, c.station_id), \
					credential_id = COALESCE(rs.credential_id, c.credential_id), \
					updated_at = CURRENT_TIMESTAMP \
				FROM (SELECT 1) AS _ \
				LEFT JOIN LATERAL ( \
					SELECT \
						org_id, \
						station_id, \
						id AS credential_id, \
						activated_at, \
						sold_at, \
						created_at \
					FROM wf_credential \
					WHERE (token = '%{SQL-User-Name}' OR username = '%{SQL-User-Name}') \
					AND deleted_at IS NULL \
					LIMIT 1 \
				) AS c ON true \
				WHERE rs.acct_session_id = '%{Acct-Session-Id}' \
				AND rs.nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND rs.stopped_at IS NULL"

			query = "\
				INSERT INTO wf_radius_session ( \
					id, org_id, station_id, credential_id, acct_session_id, user_name, status, \
					started_at, last_interim_at, \"callingStationId\", framed_ip_address, \
					nas_ip_address, nas_identifier, updated_at \
				) \
				SELECT \
					gen_random_uuid(), \
					c.org_id, \
					c.station_id, \
					c.credential_id, \
					'%{Acct-Session-Id}', \
					'%{SQL-User-Name}', \
					'START'::\"RadiusAcctStatus\", \
					${....started_at_clamped}, \
					GREATEST(${....event_timestamp}, ${....started_at_clamped}), \
					'%{Calling-Station-Id}', \
					NULLIF('%{Framed-IP-Address}', '')::text, \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{NAS-Identifier}', ''), \
					CURRENT_TIMESTAMP \
				FROM (SELECT 1) AS _ \
				LEFT JOIN LATERAL ( \
					SELECT \
						org_id, \
						station_id, \
						id AS credential_id, \
						activated_at, \
						sold_at, \
						created_at \
					FROM wf_credential \
					WHERE (token = '%{SQL-User-Name}' OR username = '%{SQL-User-Name}') \
					AND deleted_at IS NULL \
					LIMIT 1 \
				) AS c ON true \
				ON CONFLICT (acct_session_id, nas_ip_address) DO UPDATE SET \
					user_name = CASE \
						WHEN wf_radius_session.credential_id IS NULL THEN EXCLUDED.user_name \
						WHEN EXCLUDED.credential_id IS NOT NULL \
							AND EXCLUDED.credential_id = wf_radius_session.credential_id \
							THEN EXCLUDED.user_name \
						ELSE wf_radius_session.user_name \
					END, \
					last_interim_at = EXCLUDED.last_interim_at, \
					status = EXCLUDED.status, \
					\"callingStationId\" = EXCLUDED.\"callingStationId\", \
					framed_ip_address = EXCLUDED.framed_ip_address, \
					nas_identifier = EXCLUDED.nas_identifier, \
					org_id = COALESCE(wf_radius_session.org_id, EXCLUDED.org_id), \
					station_id = COALESCE(wf_radius_session.station_id, EXCLUDED.station_id), \
					credential_id = COALESCE(wf_radius_session.credential_id, EXCLUDED.credential_id), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE wf_radius_session.stopped_at IS NULL"
		}

		interim-apply {
			query = "\
				UPDATE wf_radius_session AS rs \
				SET \
					user_name = CASE \
						WHEN rs.credential_id IS NULL THEN '%{SQL-User-Name}' \
						WHEN c.credential_id IS NOT NULL AND c.credential_id = rs.credential_id \
							THEN '%{SQL-User-Name}' \
						ELSE rs.user_name \
					END, \
					framed_ip_address = NULLIF('%{Framed-IP-Address}', '')::text, \
					\"sessionTimeSec\" = COALESCE( \
						NULLIF(NULLIF('%{Acct-Session-Time}', '')::integer, 0), \
						rs.\"sessionTimeSec\" \
					), \
					last_interim_at = ${....event_timestamp}, \
					\"inputBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint), \
					\"outputBytes\" = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					\"totalBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint \
						+ ('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					status = 'INTERIM'::\"RadiusAcctStatus\", \
					nas_identifier = NULLIF('%{NAS-Identifier}', ''), \
					credential_id = COALESCE(rs.credential_id, c.credential_id), \
					org_id = COALESCE(rs.org_id, c.org_id), \
					station_id = COALESCE(rs.station_id, c.station_id), \
					updated_at = CURRENT_TIMESTAMP \
				FROM (SELECT 1) AS _ \
				LEFT JOIN LATERAL ( \
					SELECT \
						org_id, \
						station_id, \
						id AS credential_id, \
						activated_at, \
						sold_at, \
						created_at \
					FROM wf_credential \
					WHERE (token = '%{SQL-User-Name}' OR username = '%{SQL-User-Name}') \
					AND deleted_at IS NULL \
					LIMIT 1 \
				) AS c ON true \
				WHERE rs.acct_session_id = '%{Acct-Session-Id}' \
				AND rs.nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND rs.stopped_at IS NULL"
		}

		interim-update {
			query = "${...rebound-orphan.query}"
			query = "${..interim-apply.query}"

			#
			#  Late interim (no Start yet): still bind credential FKs.
			#  Keep the first credential_id — do not rebind to another token on the same
			#  Acct-Session-Id (prevents leftover Session-Timeout bleed across tokens).
			#
			query = "\
				INSERT INTO wf_radius_session ( \
					id, org_id, station_id, credential_id, acct_session_id, user_name, status, \
					started_at, last_interim_at, \"sessionTimeSec\", \"inputBytes\", \"outputBytes\", \
					\"totalBytes\", \"callingStationId\", framed_ip_address, nas_ip_address, \
					nas_identifier, updated_at \
				) \
				SELECT \
					gen_random_uuid(), \
					c.org_id, \
					c.station_id, \
					c.credential_id, \
					'%{Acct-Session-Id}', \
					'%{SQL-User-Name}', \
					'INTERIM'::\"RadiusAcctStatus\", \
					${....started_at_clamped}, \
					GREATEST(${....event_timestamp}, ${....started_at_clamped}), \
					%{%{Acct-Session-Time}:-NULL}, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint \
						+ ('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					'%{Calling-Station-Id}', \
					NULLIF('%{Framed-IP-Address}', '')::text, \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{NAS-Identifier}', ''), \
					CURRENT_TIMESTAMP \
				FROM (SELECT 1) AS _ \
				LEFT JOIN LATERAL ( \
					SELECT \
						org_id, \
						station_id, \
						id AS credential_id, \
						activated_at, \
						sold_at, \
						created_at \
					FROM wf_credential \
					WHERE (token = '%{SQL-User-Name}' OR username = '%{SQL-User-Name}') \
					AND deleted_at IS NULL \
					LIMIT 1 \
				) AS c ON true \
				ON CONFLICT (acct_session_id, nas_ip_address) DO UPDATE SET \
					user_name = CASE \
						WHEN wf_radius_session.credential_id IS NULL THEN EXCLUDED.user_name \
						WHEN EXCLUDED.credential_id IS NOT NULL \
							AND EXCLUDED.credential_id = wf_radius_session.credential_id \
							THEN EXCLUDED.user_name \
						ELSE wf_radius_session.user_name \
					END, \
					framed_ip_address = EXCLUDED.framed_ip_address, \
					\"sessionTimeSec\" = COALESCE( \
						NULLIF(EXCLUDED.\"sessionTimeSec\", 0), \
						wf_radius_session.\"sessionTimeSec\" \
					), \
					last_interim_at = EXCLUDED.last_interim_at, \
					\"inputBytes\" = EXCLUDED.\"inputBytes\", \
					\"outputBytes\" = EXCLUDED.\"outputBytes\", \
					\"totalBytes\" = EXCLUDED.\"totalBytes\", \
					status = EXCLUDED.status, \
					\"callingStationId\" = EXCLUDED.\"callingStationId\", \
					nas_identifier = EXCLUDED.nas_identifier, \
					org_id = COALESCE(wf_radius_session.org_id, EXCLUDED.org_id), \
					station_id = COALESCE(wf_radius_session.station_id, EXCLUDED.station_id), \
					credential_id = COALESCE(wf_radius_session.credential_id, EXCLUDED.credential_id), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE wf_radius_session.stopped_at IS NULL"
		}

		#
		#  Ruijie EG (and some Cisco) encode Acct-Status-Type 3 as
		#  "Alive" rather than "Interim-Update". The SQL reference uses
		#  the printable name, so without this alias octets never land.
		#
		alive {
			query = "${...rebound-orphan.query}"
			query = "${..interim-apply.query}"
		}

		stop {
			query = "${...rebound-orphan.query}"

			query = "\
				UPDATE wf_radius_session \
				SET \
					user_name = CASE \
						WHEN credential_id IS NULL THEN '%{SQL-User-Name}' \
						WHEN user_name IS NULL OR user_name = '%{SQL-User-Name}' \
							THEN '%{SQL-User-Name}' \
						ELSE user_name \
					END, \
					stopped_at = ${....event_timestamp}, \
					last_interim_at = ${....event_timestamp}, \
					\"sessionTimeSec\" = COALESCE( \
						NULLIF(NULLIF('%{Acct-Session-Time}', '')::integer, 0), \
						\"sessionTimeSec\" \
					), \
					\"inputBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint), \
					\"outputBytes\" = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					\"totalBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint \
						+ ('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					terminate_cause = '%{Acct-Terminate-Cause}', \
					framed_ip_address = NULLIF('%{Framed-IP-Address}', '')::text, \
					status = 'STOP'::\"RadiusAcctStatus\", \
					nas_identifier = NULLIF('%{NAS-Identifier}', ''), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE acct_session_id = '%{Acct-Session-Id}' \
				AND nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}'"

			query = "\
				INSERT INTO wf_radius_session ( \
					id, org_id, station_id, credential_id, acct_session_id, user_name, status, \
					started_at, last_interim_at, stopped_at, \"sessionTimeSec\", \"inputBytes\", \
					\"outputBytes\", \"totalBytes\", \"callingStationId\", terminate_cause, \
					framed_ip_address, nas_ip_address, nas_identifier, updated_at \
				) \
				SELECT \
					gen_random_uuid(), \
					c.org_id, \
					c.station_id, \
					c.credential_id, \
					'%{Acct-Session-Id}', \
					'%{SQL-User-Name}', \
					'STOP'::\"RadiusAcctStatus\", \
					${....started_at_clamped}, \
					${....event_timestamp}, \
					${....event_timestamp}, \
					NULLIF('%{Acct-Session-Time}', '')::integer, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Input-Octets}:-0}'::bigint \
						+ ('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) \
						+ '%{%{Acct-Output-Octets}:-0}'::bigint), \
					'%{Calling-Station-Id}', \
					'%{Acct-Terminate-Cause}', \
					NULLIF('%{Framed-IP-Address}', '')::text, \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{NAS-Identifier}', ''), \
					CURRENT_TIMESTAMP \
				FROM (SELECT 1) AS _ \
				LEFT JOIN LATERAL ( \
					SELECT \
						org_id, \
						station_id, \
						id AS credential_id, \
						activated_at, \
						sold_at, \
						created_at \
					FROM wf_credential \
					WHERE (token = '%{SQL-User-Name}' OR username = '%{SQL-User-Name}') \
					AND deleted_at IS NULL \
					LIMIT 1 \
				) AS c ON true \
				ON CONFLICT (acct_session_id, nas_ip_address) DO UPDATE SET \
					user_name = EXCLUDED.user_name, \
					stopped_at = EXCLUDED.stopped_at, \
					last_interim_at = EXCLUDED.last_interim_at, \
					\"sessionTimeSec\" = COALESCE( \
						NULLIF(EXCLUDED.\"sessionTimeSec\", 0), \
						wf_radius_session.\"sessionTimeSec\" \
					), \
					\"inputBytes\" = EXCLUDED.\"inputBytes\", \
					\"outputBytes\" = EXCLUDED.\"outputBytes\", \
					\"totalBytes\" = EXCLUDED.\"totalBytes\", \
					terminate_cause = EXCLUDED.terminate_cause, \
					framed_ip_address = EXCLUDED.framed_ip_address, \
					status = EXCLUDED.status, \
					\"callingStationId\" = EXCLUDED.\"callingStationId\", \
					nas_identifier = EXCLUDED.nas_identifier, \
					org_id = COALESCE(wf_radius_session.org_id, EXCLUDED.org_id), \
					station_id = COALESCE(wf_radius_session.station_id, EXCLUDED.station_id), \
					credential_id = COALESCE(wf_radius_session.credential_id, EXCLUDED.credential_id), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE wf_radius_session.user_name IS NULL \
				OR wf_radius_session.user_name = EXCLUDED.user_name"

			# Sync remaining time cache + mark CONSUMED when quota exhausted.
			query = "\
				UPDATE wf_credential c \
				SET \
					\"timeRemainingSec\" = rem.remaining_sec, \
					status = CASE \
						WHEN rem.remaining_sec <= 0 \
							AND c.status IN ('SOLD', 'ACTIVATED') \
						THEN 'CONSUMED'::\"CredentialStatus\" \
						ELSE c.status \
					END, \
					updated_at = CURRENT_TIMESTAMP \
				FROM wf_plan p \
				LEFT JOIN LATERAL ( \
					SELECT COALESCE(SUM( \
						CASE \
							WHEN COALESCE(rs.\"sessionTimeSec\", 0) > 43200 \
								AND COALESCE(rs.\"sessionTimeSec\", 0) > w.last_seen * 2 \
							THEN w.last_seen \
							WHEN COALESCE(rs.\"sessionTimeSec\", 0) > 0 \
				THEN rs.\"sessionTimeSec\" \
				ELSE w.last_seen \
						END \
					), 0)::integer AS used_sec \
					FROM wf_radius_session rs \
					CROSS JOIN LATERAL ( \
						SELECT GREATEST( \
							0, \
							FLOOR(EXTRACT(EPOCH FROM ( \
								COALESCE(rs.last_interim_at, rs.stopped_at, CURRENT_TIMESTAMP) \
								- GREATEST(rs.started_at, rs.created_at) \
							)))::integer \
						) AS last_seen \
					) w \
					WHERE ( \
						(c.username IS NOT NULL AND rs.user_name = c.username) \
						OR (c.token IS NOT NULL AND (rs.user_name = c.token OR rs.user_name = UPPER(c.token))) \
					) \
					AND ( \
						p.time_usage_mode::text IS DISTINCT FROM 'SINGLE_SESSION' \
						OR rs.started_at >= COALESCE( \
							c.single_session_reseller_unlock_at, \
							c.activated_at, \
							c.sold_at, \
							'-infinity'::timestamptz \
						) \
					) \
				) used ON true \
				CROSS JOIN LATERAL ( \
					SELECT GREATEST( \
						0, \
						(p.time_amount * \
							CASE p.time_unit \
								WHEN 'MINUTE' THEN 60 \
								WHEN 'HOUR' THEN 3600 \
								WHEN 'DAY' THEN 86400 \
								WHEN 'MONTH' THEN 2592000 \
								ELSE 0 \
							END) - COALESCE(used.used_sec, 0) \
					)::integer AS remaining_sec \
				) rem \
				WHERE p.id = c.plan_id \
				AND p.deleted_at IS NULL \
				AND (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
				AND c.deleted_at IS NULL \
				AND COALESCE(p.time_amount, 0) > 0 \
				AND p.time_unit IS NOT NULL"
		}

		# No Acct-Status-Type → ignore
		accounting {
			query = "SELECT true"
		}
	}
}

#######################################################################
#  Post-auth: radpostauth log + SOLD → ACTIVATED
#######################################################################

post-auth {
	query = "\
		INSERT INTO ${..postauth_table} \
			(username, pass, reply, authdate, callingstationid, calledstationid) \
		VALUES( \
			'%{User-Name}', \
			'%{%{User-Password}:-%{Chap-Password}}', \
			'%{reply:Packet-Type}', \
			'%S.%M', \
			NULLIF('%{Calling-Station-Id}', ''), \
			NULLIF('%{Called-Station-Id}', '') \
		)"

	query = "\
		UPDATE wf_credential c \
		SET \
			activated_at = COALESCE(c.activated_at, CURRENT_TIMESTAMP), \
			expires_at = COALESCE( \
				c.expires_at, \
				CASE \
					WHEN p.validity_days IS NOT NULL AND p.validity_days > 0 \
					THEN CURRENT_TIMESTAMP + (p.validity_days * INTERVAL '1 day') \
					ELSE NULL \
				END \
			), \
			\"timeRemainingSec\" = COALESCE( \
				c.\"timeRemainingSec\", \
				CASE \
					WHEN COALESCE(p.time_amount, 0) > 0 AND p.time_unit IS NOT NULL THEN \
						(p.time_amount * \
							CASE p.time_unit \
								WHEN 'MINUTE' THEN 60 \
								WHEN 'HOUR' THEN 3600 \
								WHEN 'DAY' THEN 86400 \
								WHEN 'MONTH' THEN 2592000 \
								ELSE 0 \
							END) \
					ELSE NULL \
				END \
			), \
			status = CASE \
				WHEN c.status = 'SOLD' THEN 'ACTIVATED'::\"CredentialStatus\" \
				ELSE c.status \
			END, \
			updated_at = CURRENT_TIMESTAMP \
		FROM wf_plan p \
		WHERE p.id = c.plan_id \
		AND (c.token = '%{User-Name}' OR c.username = '%{User-Name}') \
		AND (c.activated_at IS NULL OR c.status = 'SOLD') \
		AND c.status IN ('SOLD', 'ACTIVATED') \
		AND c.deleted_at IS NULL \
		AND c.revoked_at IS NULL \
		AND '%{reply:Packet-Type}' = 'Access-Accept'"
}
