group_membership_query = "\
	SELECT p.code || COALESCE(c.username, c.token) AS groupname \
	FROM wf_credential c \
	INNER JOIN wf_plan p ON p.id = c.plan_id AND p.deleted_at IS NULL \
	WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
	AND (c.username IS NOT NULL OR c.token IS NOT NULL) \
	AND (c.expires_at IS NULL OR c.expires_at > CURRENT_TIMESTAMP) \
	AND c.deleted_at IS NULL \
	ORDER BY 1"

#######################################################################
# Accounting and Post-Auth Queries
#######################################################################
# These queries insert/update accounting and authentication records.
# The query to use is determined by the value of 'reference'.
# This value is used as a configuration path and should resolve to one
# or more 'query's. If reference points to multiple queries, and a query
# fails, the next query is executed.
#
# Behaviour is identical to the old 1.x/2.x module, except we can now
# fail between N queries, and query selection can be based on any
# combination of attributes, or custom 'Acct-Status-Type' values.
#######################################################################

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	#
	# wf_radius_session: one row per (acct_session_id, nas_ip_address).
	# UPDATE open rows first; INSERT fallback uses ON CONFLICT DO UPDATE.
	# Start INSERT also resolves org_id / station_id / credential_id from wf_credential.
	# Write SQL queries to a logfile. This is potentially useful for bulk inserts
	# when used with the rlm_sql_null driver.
#	logfile = ${logdir}/accounting.sql

	column_list = "\
		AcctSessionId, \
		AcctUniqueId, \
		UserName, \
		Realm, \
		NASIPAddress, \
		NASPortId, \
		NASPortType, \
		AcctStartTime, \
		AcctUpdateTime, \
		AcctStopTime, \
		AcctSessionTime, \
		AcctAuthentic, \
		ConnectInfo_start, \
		ConnectInfo_Stop, \
		AcctInputOctets, \
		AcctOutputOctets, \
		CalledStationId, \
		CallingStationId, \
		AcctTerminateCause, \
		ServiceType, \
		FramedProtocol, \
		FramedIpAddress, \
		FramedIpv6Address, \
		FramedIpv6Prefix, \
		FramedInterfaceId, \
		DelegatedIpv6Prefix \
		${..class.column_name}"

	type {

		accounting-on {

			#
			#  "Bulk update" Accounting-On/Off strategy.
			#
			#  Immediately terminate all open wf_radius_session rows for this NAS.
			#
			query = "\
				UPDATE wf_radius_session \
				SET \
					stopped_at = ${....event_timestamp}, \
					last_interim_at = ${....event_timestamp}, \
					\"sessionTimeSec\" = (${....event_timestamp_epoch} - EXTRACT(EPOCH FROM(started_at)))::integer, \
					terminate_cause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}', \
					status = 'STOP'::\"RadiusAcctStatus\", \
					updated_at = CURRENT_TIMESTAMP \
				WHERE stopped_at IS NULL \
				AND nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND started_at <= ${....event_timestamp}"

			#
			#  "Lightweight" Accounting-On/Off strategy.
			#
			#  Record the reload time of the NAS and let the
			#  administrator actually close the sessions in radacct
			#  out-of-band, if desired.
			#
			#  Implementation advice, together with a stored
			#  procedure for closing sessions and a view showing
			#  the effective stop time of each session is provided
			#  in process-radacct.sql.
			#
			#  To enable this strategy, just change the previous
			#  query to "-query", and this one to "query".  The
			#  previous one will be ignored, and this one will be
			#  enabled.
			#
			-query = "\
				INSERT INTO nasreload (NASIPAddress, ReloadTime) \
				VALUES ('%{NAS-IP-Address}', ${....event_timestamp}) \
				ON CONFLICT ON (NASIPAddress) \
				DO UPDATE SET \
					ReloadTime = ${....event_timestamp}"

		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		#
		#  Implement the "sql_session_start" policy.
		#  See raddb/policy.d/accounting for more details.
		#
		#  You also need to fix the other queries as
		#  documented below.  Look for "sql_session_start".
		#
		post-auth {
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES(\
					'%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					NULLIF('%{Realm}', ''), \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
					'%{NAS-Port-Type}', \
					${....event_timestamp}, \
					${....event_timestamp}, \
					NULL, \
					0, \
					'', \
					'%{Connect-Info}', \
					NULL, \
					0, \
					0, \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					NULL, \
					'%{Service-Type}', \
					'', \
					NULL, \
					NULL, \
					NULL, \
					NULL, \
					NULL \
					${....class.reply_xlat})"

			query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctStartTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					ConnectInfo_start = '%{Connect-Info}', \
					AcctSessionId = '%{Acct-Session-Id}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}' \
				AND AcctStopTime IS NULL"
		}

		start {
			query = "\
				UPDATE wf_radius_session \
				SET \
					user_name = '%{SQL-User-Name}', \
					started_at = ${....event_timestamp}, \
					last_interim_at = ${....event_timestamp}, \
					status = 'START'::\"RadiusAcctStatus\", \
					\"callingStationId\" = '%{Calling-Station-Id}', \
					framed_ip_address = NULLIF('%{Framed-IP-Address}', '')::text, \
					nas_identifier = NULLIF('%{NAS-Identifier}', ''), \
					org_id = COALESCE(wf_radius_session.org_id, (\
						SELECT c.org_id FROM wf_credential c \
						WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
						AND c.deleted_at IS NULL LIMIT 1)), \
					station_id = COALESCE(wf_radius_session.station_id, (\
						SELECT c.station_id FROM wf_credential c \
						WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
						AND c.deleted_at IS NULL LIMIT 1)), \
					credential_id = COALESCE(wf_radius_session.credential_id, (\
						SELECT c.id FROM wf_credential c \
						WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
						AND c.deleted_at IS NULL LIMIT 1)), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE acct_session_id = '%{Acct-Session-Id}' \
				AND nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND stopped_at IS NULL"

			query = "\
				INSERT INTO wf_radius_session (\
					id, org_id, station_id, credential_id, acct_session_id, user_name, status, \
					started_at, last_interim_at, \"callingStationId\", framed_ip_address, \
					nas_ip_address, nas_identifier, updated_at\
				) \
				VALUES(\
					gen_random_uuid(), \
					(SELECT c.org_id FROM wf_credential c \
						WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
						AND c.deleted_at IS NULL LIMIT 1), \
					(SELECT c.station_id FROM wf_credential c \
						WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
						AND c.deleted_at IS NULL LIMIT 1), \
					(SELECT c.id FROM wf_credential c \
						WHERE (c.token = '%{SQL-User-Name}' OR c.username = '%{SQL-User-Name}') \
						AND c.deleted_at IS NULL LIMIT 1), \
					'%{Acct-Session-Id}', \
					'%{SQL-User-Name}', \
					'START'::\"RadiusAcctStatus\", \
					${....event_timestamp}, \
					${....event_timestamp}, \
					'%{Calling-Station-Id}', \
					NULLIF('%{Framed-IP-Address}', '')::text, \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{NAS-Identifier}', ''), \
					CURRENT_TIMESTAMP \
				) \
				ON CONFLICT (acct_session_id, nas_ip_address) DO UPDATE SET \
					user_name = EXCLUDED.user_name, \
					started_at = EXCLUDED.started_at, \
					last_interim_at = EXCLUDED.last_interim_at, \
					status = EXCLUDED.status, \
					\"callingStationId\" = EXCLUDED.\"callingStationId\", \
					framed_ip_address = EXCLUDED.framed_ip_address, \
					nas_identifier = EXCLUDED.nas_identifier, \
					org_id = COALESCE(wf_radius_session.org_id, EXCLUDED.org_id), \
					station_id = COALESCE(wf_radius_session.station_id, EXCLUDED.station_id), \
					credential_id = COALESCE(wf_radius_session.credential_id, EXCLUDED.credential_id), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE wf_radius_session.stopped_at IS NULL"
		}

		interim-update {
			query = "\
				UPDATE wf_radius_session \
				SET \
					user_name = '%{SQL-User-Name}', \
					framed_ip_address = NULLIF('%{Framed-IP-Address}', '')::text, \
					\"sessionTimeSec\" = %{%{Acct-Session-Time}:-NULL}, \
					last_interim_at = ${....event_timestamp}, \
					\"inputBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					\"outputBytes\" = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					\"totalBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint + \
						('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					status = 'INTERIM'::\"RadiusAcctStatus\", \
					nas_identifier = NULLIF('%{NAS-Identifier}', ''), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE acct_session_id = '%{Acct-Session-Id}' \
				AND nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND stopped_at IS NULL"

			query = "\
				INSERT INTO wf_radius_session (\
					id, acct_session_id, user_name, status, \
					started_at, last_interim_at, \"sessionTimeSec\", \"inputBytes\", \"outputBytes\", \
					\"totalBytes\", \"callingStationId\", framed_ip_address, nas_ip_address, \
					nas_identifier, updated_at\
				) \
				VALUES(\
					gen_random_uuid(), \
					'%{Acct-Session-Id}', \
					'%{SQL-User-Name}', \
					'INTERIM'::\"RadiusAcctStatus\", \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					%{%{Acct-Session-Time}:-NULL}, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint + \
						('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					'%{Calling-Station-Id}', \
					NULLIF('%{Framed-IP-Address}', '')::text, \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{NAS-Identifier}', ''), \
					CURRENT_TIMESTAMP \
				) \
				ON CONFLICT (acct_session_id, nas_ip_address) DO UPDATE SET \
					user_name = EXCLUDED.user_name, \
					framed_ip_address = EXCLUDED.framed_ip_address, \
					\"sessionTimeSec\" = EXCLUDED.\"sessionTimeSec\", \
					last_interim_at = EXCLUDED.last_interim_at, \
					\"inputBytes\" = EXCLUDED.\"inputBytes\", \
					\"outputBytes\" = EXCLUDED.\"outputBytes\", \
					\"totalBytes\" = EXCLUDED.\"totalBytes\", \
					status = EXCLUDED.status, \
					\"callingStationId\" = EXCLUDED.\"callingStationId\", \
					nas_identifier = EXCLUDED.nas_identifier, \
					updated_at = CURRENT_TIMESTAMP \
				WHERE wf_radius_session.stopped_at IS NULL"
		}

		stop {
			query = "\
				UPDATE wf_radius_session \
				SET \
					user_name = '%{SQL-User-Name}', \
					stopped_at = ${....event_timestamp}, \
					last_interim_at = ${....event_timestamp}, \
					\"sessionTimeSec\" = COALESCE(%{%{Acct-Session-Time}:-NULL}, \
						(${....event_timestamp_epoch} - EXTRACT(EPOCH FROM(started_at))))::integer, \
					\"inputBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					\"outputBytes\" = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					\"totalBytes\" = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint + \
						('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					terminate_cause = '%{Acct-Terminate-Cause}', \
					framed_ip_address = NULLIF('%{Framed-IP-Address}', '')::text, \
					status = 'STOP'::\"RadiusAcctStatus\", \
					nas_identifier = NULLIF('%{NAS-Identifier}', ''), \
					updated_at = CURRENT_TIMESTAMP \
				WHERE acct_session_id = '%{Acct-Session-Id}' \
				AND nas_ip_address = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}'"

			query = "\
				INSERT INTO wf_radius_session (\
					id, acct_session_id, user_name, status, \
					started_at, last_interim_at, stopped_at, \"sessionTimeSec\", \"inputBytes\", \
					\"outputBytes\", \"totalBytes\", \"callingStationId\", terminate_cause, \
					framed_ip_address, nas_ip_address, nas_identifier, updated_at\
				) \
				VALUES(\
					gen_random_uuid(), \
					'%{Acct-Session-Id}', \
					'%{SQL-User-Name}', \
					'STOP'::\"RadiusAcctStatus\", \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					${....event_timestamp}, \
					NULLIF('%{Acct-Session-Time}', '')::integer, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint + \
						('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					'%{Calling-Station-Id}', \
					'%{Acct-Terminate-Cause}', \
					NULLIF('%{Framed-IP-Address}', '')::text, \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{NAS-Identifier}', ''), \
					CURRENT_TIMESTAMP \
				) \
				ON CONFLICT (acct_session_id, nas_ip_address) DO UPDATE SET \
					user_name = EXCLUDED.user_name, \
					stopped_at = EXCLUDED.stopped_at, \
					last_interim_at = EXCLUDED.last_interim_at, \
					\"sessionTimeSec\" = EXCLUDED.\"sessionTimeSec\", \
					\"inputBytes\" = EXCLUDED.\"inputBytes\", \
					\"outputBytes\" = EXCLUDED.\"outputBytes\", \
					\"totalBytes\" = EXCLUDED.\"totalBytes\", \
					terminate_cause = EXCLUDED.terminate_cause, \
					framed_ip_address = EXCLUDED.framed_ip_address, \
					status = EXCLUDED.status, \
					\"callingStationId\" = EXCLUDED.\"callingStationId\", \
					nas_identifier = EXCLUDED.nas_identifier, \
					updated_at = CURRENT_TIMESTAMP"
		}

		#
		#  No Acct-Status-Type == ignore the packet
		#
		accounting {
		     query = "SELECT true"
		}
	}
}


#######################################################################
# Authentication Logging Queries
#######################################################################
# postauth_query                - Insert some info after authentication
#######################################################################

post-auth {
	# Write SQL queries to a logfile. This is potentially useful for bulk inserts
	# when used with the rlm_sql_null driver.
#	logfile = ${logdir}/post-auth.sql

	# Log authentication attempt to standard postauth table
	query = "\
		INSERT INTO ${..postauth_table} \
			(username, pass, reply, authdate ${..class.column_name}) \
		VALUES(\
			'%{User-Name}', \
			'%{%{User-Password}:-%{Chap-Password}}', \
			'%{reply:Packet-Type}', \
			'%S.%M' \
			${..class.reply_xlat})"

	# Activate credential on Access-Accept (SOLD → ACTIVATED)
	query = "\
		UPDATE wf_credential \
		SET \
			activated_at = CURRENT_TIMESTAMP, \
			status = CASE \
				WHEN status = 'SOLD' THEN 'ACTIVATED'::\"CredentialStatus\" \
				ELSE status \
			END, \
			updated_at = CURRENT_TIMESTAMP \
		WHERE (token = '%{User-Name}' OR username = '%{User-Name}') \
		AND activated_at IS NULL \
		AND status IN ('SOLD', 'ACTIVATED', 'ACTIVE', 'NEW') \
		AND deleted_at IS NULL \
		AND revoked_at IS NULL \
		AND '%{reply:Packet-Type}' = 'Access-Accept'"
}
