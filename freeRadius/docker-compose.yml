# Volo FreeRADIUS — production compose (Dokploy / Docker)
#
# Deploy:
#   docker compose up -d
#
# Dokploy → Logs → select container "freeradius"
#
# Debug (full packet/SQL dump) — do not leave this on in production:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
#
# Requires:
#   - ./raddb mounted at /etc/raddb (includes certs/do-ca-certificate.crt)
#   - DB connection in raddb/mods-available/sql (DO Managed PostgreSQL + SSL)

services:
  freeradius:
    image: freeradius/freeradius-server:3.2.8
    container_name: freeradius
    restart: unless-stopped
    network_mode: "host"
    environment:
      # Process + PG session Asia/Yangon. DB columns are timestamptz (absolute instants).
      TZ: Asia/Yangon
      PGTZ: Asia/Yangon
    ports:
      - "1812:1812/udp"   # Authentication
      - "1813:1813/udp"   # Accounting

    volumes:
      - ./raddb:/etc/raddb
      - freeradius-logs:/var/log/freeradius

    # Foreground, not -X. Auth accept/reject still go to Dokploy via log_auth_console.
    entrypoint: ["freeradius"]
    command:
      - -f
      - -d
      - /etc/raddb

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Purge linelog / leftover detail files so the log volume cannot fill the disk.
  freeradius-log-cleanup:
    image: busybox:1.36
    container_name: freeradius-log-cleanup
    restart: unless-stopped
    environment:
      TZ: Asia/Yangon
      LOGDIR: /var/log/freeradius
      KEEP_DAYS: "3"   # linelog-auth-* only; radacct/ is always purged
      MAX_MB: "50"
    volumes:
      - ./raddb/scripts/cleanup-logs.sh:/cleanup-logs.sh:ro
      - freeradius-logs:/var/log/freeradius
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sh /cleanup-logs.sh
          sleep 43200
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  freeradius-logs:
