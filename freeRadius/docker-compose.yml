# Volo FreeRADIUS — production compose (Dokploy / Docker)
#
# Deploy:
#   docker compose up -d
#
# Dokploy → Logs → select container "freeradius"
#
# TEMP: full debug (-X) so Dokploy shows every packet/SQL line.
# Revert to `freeradius -f -d /etc/raddb` when done debugging (see docker-compose.debug.yml).
#
# Requires:
#   - ./raddb mounted at /etc/raddb (includes certs/do-ca-certificate.crt)
#   - DB connection in raddb/mods-available/sql (DO Managed PostgreSQL + SSL)

services:
  freeradius:
    image: freeradius/freeradius-server:3.2.8
    container_name: freeradius
    restart: unless-stopped
    network_mode: "host"
    ports:
      - "1812:1812/udp"   # Authentication
      - "1813:1813/udp"   # Accounting

    volumes:
      - ./raddb:/etc/raddb
      - freeradius-logs:/var/log/freeradius

    # Full debug to stdout → visible in Dokploy Logs / docker compose logs -f
    entrypoint: ["freeradius"]
    command:
      - -X
      - -d
      - /etc/raddb

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  freeradius-logs:
