<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Volo WiFi — Login success</title>
    <script src="portal-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function portalDashboardUrl() {
            return window.voloPortalDashboardUrl();
        }
        function startClock() {
            location.href = portalDashboardUrl();
        }
    </script>
</head>
<body onload="startClock()">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <h1>Login successful</h1>
                <p class="info">Redirecting to your Volo WiFi dashboard...</p>
                <p class="info">If nothing happens, <a id="dash-link" href="#">click here</a></p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('dash-link').href = portalDashboardUrl();
    </script>
</body>
</html>
